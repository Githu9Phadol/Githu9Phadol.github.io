<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shader Starter (Matrix)</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
  // Scene / Camera / Renderer
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFFFFFF);

  const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 0, 2.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  // ค่าที่ส่งจาก JavaScript เข้า shader
  const uniforms = {
    uTime: { value: 0.0 },
    uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
    uTexture: { value: new THREE.TextureLoader().load('https://threejs.org/examples/textures/uv_grid_opengl.jpg') }
  };

  const vertexShader = `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {
      vUv = uv;
      vNormal = normal;
      vec3 pos = position;

      // เริ่มเขียน vertex shader ที่นี่
      pos.z += sin(pos.x * 5.0 + uTime) * 0.1;

      //object space
      //gl_Position = vec4(pos, 1.0);

      //world space
      //gl_Position = modelMatrix * vec4(pos, 1.0);

      //view space
      //gl_Position = viewMatrix * modelMatrix * vec4(pos, 1.0);

      // perspective มีใกล้ไกล เก็บค่าใว้เลื่อนหมุนได้
      gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(pos, 1.0);
    }
  `;

  const fragmentShader = `
    precision mediump float;
    uniform sampler2D uTexture;
    varying vec2 vUv;
    varying vec3 vNormal;
    uniform vec3 uLightDir;

    void main() {
      // เริ่มเขียน fragment shader ที่นี่
      //vec3 color = vec3(vUv, 0.5);
      //vec3 color = vec3(0.0, 0.5, 1.0);
      vec3 color = texture2D(uTexture, vUv).rgb;

      //lambert diffuse
      vec3 N = normalize(vNormal);
      vec3 L = normalize(uLightDir);
      float diffuse = max(dot(N, L), 0.0);

      float ambient = 0.5;

      //toon shading — ปรับ diffuse ก่อนคูณ color เสมอ
      diffuse = smoothstep(0.2, 0.3, diffuse);

      color = color * (diffuse + ambient);

      gl_FragColor = vec4(color, 1.0);
    }
  `;

  const outlineVertexShader = `
    uniform float uTime;

    void main() {
      vec3 pos = position;

      // ต้องขยับคลื่นเหมือน vertex shader หลัก ก่อนขยายผิว
      pos.z += sin(pos.x * 5.0 + uTime) * 0.1;

      // ขยายผิวออกไปตามทิศ normal ให้บวมขึ้นเล็กน้อย
      pos += normal * 0.08;

      gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(pos, 1.0);
    }
  `;

  const outlineFragmentShader = `
    precision mediump float;

    void main() {
      gl_FragColor = vec4(0.1, 0.1, 0.1, 1.0);
    }
  `;

  // ใช้ segment หลายช่อง เพื่อให้ vertex shader ดัดรูปทรงได้ละเอียด
  const geometry = new THREE.TorusKnotBufferGeometry(0.52, 0.2, 96, 16);

  const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms,
    side: THREE.DoubleSide
  });

  const outlineMaterial = new THREE.ShaderMaterial({
    vertexShader: outlineVertexShader,
    fragmentShader: outlineFragmentShader,
    uniforms,
    side: THREE.BackSide
  });

  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // ใช้ geometry ก้อนเดียวกัน ประหยัดหน่วยความจำ และ position ต้องตรงกับ mesh หลักเป๊ะ
  const outlineMesh = new THREE.Mesh(geometry, outlineMaterial);
  scene.add(outlineMesh);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  function animate(time) {
    uniforms.uTime.value = time * 0.001;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
