<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classic Paint App - Rasterized</title>
    <style>
        body {
            background-color: #c0c0c0; /* Classic Windows grey */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .toolbar {
            background-color: #c0c0c0;
            border: 2px outset #ffffff;
            padding: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 5px;
            border-right: 2px groove #ffffff;
            padding-right: 15px;
        }
        .tool-group:last-child {
            border-right: none;
            padding-right: 0;
        }
        button {
            background-color: #c0c0c0;
            border: 2px outset #ffffff;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 13px;
        }
        button:active, button.active {
            border: 2px inset #ffffff;
            background-color: #dfdfdf;
        }
        label {
            font-size: 13px;
        }
        input[type="number"] {
            width: 45px;
        }
        canvas {
            background-color: white;
            border: 3px inset #ffffff;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="tool-group">
            <button class="tool-btn active" data-tool="pencil" title="Pencil (P)">Pencil (P)</button>
            <button class="tool-btn" data-tool="line" title="Line (L)">Line (L)</button>
            <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">Rect (R)</button>
            <button class="tool-btn" data-tool="ellipse" title="Ellipse (C)">Ellipse (C)</button>
            <button class="tool-btn" data-tool="polygon" title="Polygon (G)">Polygon (G)</button>
            <button class="tool-btn" data-tool="eraser" title="Eraser (E)">Eraser (E)</button>
        </div>
        
        <div class="tool-group">
            <label>Color:</label>
            <input type="color" id="color-picker" value="#000000">
        </div>

        <div class="tool-group">
            <label>Thickness: <span id="thickness-val">2</span></label>
            <input type="range" id="thickness" min="1" max="20" value="2">
        </div>

        <div class="tool-group">
            <label>Polygon Sides:</label>
            <input type="number" id="poly-sides" min="3" max="10" value="5">
        </div>

        <div class="tool-group">
            <button id="clear-btn">Clear Canvas</button>
        </div>
    </div>
    
    <canvas id="paint-canvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const toolBtns = document.querySelectorAll('.tool-btn');
        const colorPicker = document.getElementById('color-picker');
        const thicknessInput = document.getElementById('thickness');
        const thicknessVal = document.getElementById('thickness-val');
        const clearBtn = document.getElementById('clear-btn');
        const polySidesInput = document.getElementById('poly-sides');

        // Initial fill white using raster manipulation
        let imageData = ctx.createImageData(canvas.width, canvas.height);
        let pixels = imageData.data;
        
        function fillBackground(r, g, b, a = 255) {
            for (let i = 0; i < pixels.length; i += 4) {
                pixels[i] = r;
                pixels[i+1] = g;
                pixels[i+2] = b;
                pixels[i+3] = a;
            }
            ctx.putImageData(imageData, 0, 0);
        }
        fillBackground(255, 255, 255);

        // State variables
        let isDrawing = false;
        let currentTool = 'pencil';
        let currentColor = {r: 0, g: 0, b: 0};
        let currentThickness = 2;
        let startX, startY;
        let previousX, previousY;
        let snapshot;

        // Convert hex to rgb
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : {r: 0, g: 0, b: 0};
        }

        // Toolbar Events
        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('.tool-btn.active').classList.remove('active');
                btn.classList.add('active');
                currentTool = btn.getAttribute('data-tool');
            });
        });

        colorPicker.addEventListener('input', (e) => {
            currentColor = hexToRgb(e.target.value);
        });

        thicknessInput.addEventListener('input', (e) => {
            currentThickness = parseInt(e.target.value, 10);
            thicknessVal.textContent = currentThickness;
        });

        clearBtn.addEventListener('click', () => {
            imageData = ctx.createImageData(canvas.width, canvas.height);
            pixels = imageData.data;
            fillBackground(255, 255, 255);
        });

        // Raster Algorithms
        function putPixel(x, y, r, g, b, a = 255) {
            // Apply thickness by drawing a small circle for each pixel if thickness > 1
            if (currentThickness <= 1) {
                setPixelData(x, y, r, g, b, a);
            } else {
                const radius = Math.floor(currentThickness / 2);
                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        if (dx*dx + dy*dy <= radius*radius) {
                            setPixelData(x + dx, y + dy, r, g, b, a);
                        }
                    }
                }
            }
        }

        function setPixelData(x, y, r, g, b, a = 255) {
            if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
                const idx = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
                pixels[idx] = r;
                pixels[idx + 1] = g;
                pixels[idx + 2] = b;
                pixels[idx + 3] = a;
            }
        }

        function drawLineRaster(x1, y1, x2, y2, r, g, b, a = 255) {
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);
            
            // Bresenham-like DDA
            if (dx > dy) {
                if (x1 > x2) {
                    [x1, x2] = [x2, x1];
                    [y1, y2] = [y2, y1];
                }
                const m = (y2 - y1) / (x2 - x1);
                const c = y1 - m * x1;
                for (let x = x1; x <= x2; x++) {
                    const y = Math.round(m * x + c);
                    putPixel(x, y, r, g, b, a);
                }
            } else {
                if (y1 > y2) {
                    [y1, y2] = [y2, y1];
                    [x1, x2] = [x2, x1];
                }
                if (y1 === y2) { // point
                    putPixel(x1, y1, r, g, b, a);
                    return;
                }
                const m = (x2 - x1) / (y2 - y1);
                const c = x1 - m * y1;
                for (let y = y1; y <= y2; y++) {
                    const x = Math.round(m * y + c);
                    putPixel(x, y, r, g, b, a);
                }
            }
        }

        function drawRectRaster(x1, y1, x2, y2, r, g, b, a = 255) {
            drawLineRaster(x1, y1, x2, y1, r, g, b, a);
            drawLineRaster(x2, y1, x2, y2, r, g, b, a);
            drawLineRaster(x2, y2, x1, y2, r, g, b, a);
            drawLineRaster(x1, y2, x1, y1, r, g, b, a);
        }

        function drawEllipseRaster(cx, cy, rx, ry, r, g, b, a = 255) {
            if (rx === 0 || ry === 0) return;
            // A simple approach checking bounding box
            const rxSq = rx * rx;
            const rySq = ry * ry;
            for (let y = -ry; y <= ry; y++) {
                for (let x = -rx; x <= rx; x++) {
                    // Check if it's on the boundary (approximate for hollow ellipse)
                    const val = (x * x) / rxSq + (y * y) / rySq;
                    // thickness handling can be tricky for hollow shapes using math, 
                    // so we rely on putPixel's built-in thickness
                    if (val >= 0.85 && val <= 1.15) { 
                        putPixel(cx + x, cy + y, r, g, b, a);
                    }
                }
            }
        }

        function drawPolygonRaster(cx, cy, radius, sides, r, g, b, a = 255) {
            if (sides < 3) return;
            const angle = (Math.PI * 2) / sides;
            let pts = [];
            for (let i = 0; i <= sides; i++) { // go up to sides to close the loop
                pts.push({
                    x: Math.round(cx + radius * Math.cos(angle * i)),
                    y: Math.round(cy + radius * Math.sin(angle * i))
                });
            }
            for (let i = 0; i < sides; i++) {
                drawLineRaster(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y, r, g, b, a);
            }
        }

        const getMousePos = (e) => {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor(e.clientX - rect.left),
                y: Math.floor(e.clientY - rect.top)
            };
        };

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            startX = pos.x;
            startY = pos.y;
            previousX = startX;
            previousY = startY;
            
            // Save current state for previewing shapes
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            // Also update our working imageData to match
            imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            pixels = imageData.data;
            
            if (currentTool === 'pencil' || currentTool === 'eraser') {
                const color = currentTool === 'eraser' ? {r:255, g:255, b:255} : currentColor;
                putPixel(startX, startY, color.r, color.g, color.b);
                ctx.putImageData(imageData, 0, 0);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            
            const pos = getMousePos(e);
            
            if (currentTool === 'pencil' || currentTool === 'eraser') {
                const color = currentTool === 'eraser' ? {r:255, g:255, b:255} : currentColor;
                drawLineRaster(previousX, previousY, pos.x, pos.y, color.r, color.g, color.b);
                ctx.putImageData(imageData, 0, 0);
                previousX = pos.x;
                previousY = pos.y;
            } else {
                // For shapes, restore from snapshot
                ctx.putImageData(snapshot, 0, 0);
                // Update our working array from snapshot to draw the preview
                imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                pixels = imageData.data;
                
                const r = currentColor.r;
                const g = currentColor.g;
                const b = currentColor.b;
                
                if (currentTool === 'line') {
                    drawLineRaster(startX, startY, pos.x, pos.y, r, g, b);
                } else if (currentTool === 'rectangle') {
                    drawRectRaster(startX, startY, pos.x, pos.y, r, g, b);
                } else if (currentTool === 'ellipse') {
                    const radiusX = Math.abs(pos.x - startX) / 2;
                    const radiusY = Math.abs(pos.y - startY) / 2;
                    const centerX = Math.round(startX + (pos.x - startX) / 2);
                    const centerY = Math.round(startY + (pos.y - startY) / 2);
                    drawEllipseRaster(centerX, centerY, Math.round(radiusX), Math.round(radiusY), r, g, b);
                } else if (currentTool === 'polygon') {
                    const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                    const sides = parseInt(polySidesInput.value, 10);
                    drawPolygonRaster(startX, startY, radius, sides, r, g, b);
                }
                ctx.putImageData(imageData, 0, 0);
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (isDrawing) {
                isDrawing = false;
                // Finalize drawing
                ctx.putImageData(imageData, 0, 0);
            }
        });

        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

        window.addEventListener('keydown', (e) => {
            const toolKeys = {
                'p': 'pencil',
                'l': 'line',
                'r': 'rectangle',
                'c': 'ellipse',
                'g': 'polygon',
                'e': 'eraser'
            };
            const key = e.key.toLowerCase();
            if (toolKeys[key]) {
                const activeBtn = document.querySelector('.tool-btn.active');
                if (activeBtn) activeBtn.classList.remove('active');
                const btn = document.querySelector(`.tool-btn[data-tool="${toolKeys[key]}"]`);
                if(btn) {
                    btn.classList.add('active');
                    currentTool = toolKeys[key];
                }
            }
        });
    </script>
</body>
</html>
